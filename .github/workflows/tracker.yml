name: Casio Discount Monitor

on:
  schedule:
    # Runs automatically every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  check-discounts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Discount Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT || '1.0' }}
        run: |
          python casio_tracker.py --once

      - name: Commit and Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --quiet --staged; then
            echo "State changes detected, committing..."
            git commit -m "Update discount state [skip ci]"
            git push origin main || (git pull --rebase -X theirs origin main && git push origin main) || echo "Push skipped: state will sync on next run"
          else
            echo "No price changes detected. State is up to date."
          fi
