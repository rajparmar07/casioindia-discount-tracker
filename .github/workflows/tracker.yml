name: Casio Discount Monitor

on:
  schedule:
    # Runs automatically every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Reset state cache (re-send all currently active discount alerts)?'
        type: boolean
        default: false
        required: false
  repository_dispatch:
    types: [check-discounts, ping]

# Ensure only one instance of the monitor runs at a time
concurrency:
  group: casio-discount-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-discounts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Discount Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT || '1.0' }}
          NOTIFY_NEW_LISTINGS: ${{ vars.NOTIFY_NEW_LISTINGS || 'true' }}
          NOTIFY_RESTOCKS: ${{ vars.NOTIFY_RESTOCKS || 'true' }}
          NOTIFY_DISCOUNTS: ${{ vars.NOTIFY_DISCOUNTS || 'true' }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.reset_state }}" = "true" ]; then
            echo "Reset state checkbox selected! Re-sending all active discounts..."
            EXTRA_FLAGS="--reset-state"
          fi
          python casio_tracker.py --once $EXTRA_FLAGS

      - name: Commit and Push Updated State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update discount state [skip ci]"
          file_pattern: "data/state.json"
